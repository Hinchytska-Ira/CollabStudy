<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CollabStudy - Логін</title>
  <link rel="stylesheet" href="../Ira/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div id="header-placeholder"></div>
    
    <main>
      <section class="register-left">
        <img src="../assets/logo.svg" alt="Owl mascot">
        <h1><span>Collab</span>Study</h1>
      </section>

      <div class="right">
        <div class="form-box">
          <h2>Логін</h2>
          <form>
            <label>Пошта:</label>
            <input type="email" />
            <label>Пароль:</label>
            <input type="password" />
            <button class="login-btn">Логін</button>
            <button class="google-btn">
              <i class="fab fa-google"></i> Увійти за допомогою
            </button>
          </form>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/loadHeader.js"></script>
        <script src="/js/loadFooter.js"></script>
    </main>

    <footer>
     
      <p>Соціальні мережі</p>
      <div class="socials">
        <i class="fab fa-instagram"></i>
        <i class="fab fa-linkedin-in"></i>
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-github"></i>
      </div>
    </footer>
  </div>
</body>
</html>
